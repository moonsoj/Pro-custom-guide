# 사전문진 커스텀 — 현장담당자 가이드

V.Doc Pro v2.1 기준 · 2026.05

---

## 0. 시작하기 전에 {#intro}

### 0-1. 이 가이드를 보는 분께 {#intro-target}

이 가이드는 **현장담당자**가 의료진 옆에 앉아 "지금 바로 사전문진 양식을 만들거나 고쳐드릴게요"를 해낼 수 있도록 만들어졌습니다.

- 사전문진 커스텀 기능을 **처음 접하는 분**도 따라할 수 있게 단계별로 풀어 적었습니다.
- 화면 ID(A-00, A-01, A-03)는 기능명세서와 동일하게 표기하되, 본문은 일상어로 풀어 설명합니다.
- 개발 용어(Draft, Live 등)는 등장할 때마다 풀어 쓰고, 처음 한 번만 원어를 괄호로 병기합니다.

### 0-2. 사전문진 커스텀이 뭔가요 {#intro-what}

각 의료진이 환자에게 미리 받고 싶은 질문지(사전문진)를 **의료진별로 다르게 구성**해 운영하는 기능입니다. 기존에는 의료진의 요구를 받으면 개발팀이 만들어드렸지만, 이제는 **현장담당자가 의료진 옆에서 그 자리에서** 양식을 만들고 적용할 수 있습니다.

### 0-3. 자주 나오는 5개 단어 {#intro-terms}

가이드를 읽기 전에 이 다섯 단어만 익혀두시면 됩니다.

| 단어 | 뜻 |
|---|---|
| **필수 문항** | 환자가 어떤 답변을 선택하든 반드시 한 번 거치는 질문 |
| **후속 문항** | 필수 문항의 특정 답변을 선택했을 때만 이어지는 질문 |
| **작업 중인 양식** (Draft) | 아직 환자에게 보이지 않는, 편집 중인 양식 |
| **운영 중인 양식** (Live) | 지금 환자에게 실제 노출되는 양식. 의료진당 1개 |
| **양식 파일** (.txt) | 양식을 다른 곳으로 옮기기 위해 만들어진 텍스트 파일 |

### 0-4. 두 가지 운영 환경 {#intro-environments}

병원이 어떤 환경에서 V.Doc Pro를 쓰는지에 따라 **양식을 의료진에게 적용하는 절차**가 달라집니다. 핵심은 [배포완료] 액션 자체는 동일하고, **양식 파일을 의료진 PC로 직접 전달해야 하는지 여부**만 다르다는 점입니다.

| 구분 | 온프레미스 (On-premise) | 클라우드 SaaS |
|---|---|---|
| 환경 설명 | 병원 내부 서버에 V.Doc Pro 설치 | AITRICS 클라우드에서 호스팅 |
| 양식이 저장되는 곳 | 병원 내부 서버 | AITRICS 클라우드 |
| 의료진에게 양식 적용하는 방법 | **양식 파일(.txt)** 의료진 PC로 전달 → 의료진이 직접 적용 → 현장담당자가 [배포완료] | 현장담당자가 **[배포완료]** 버튼 한 번 클릭 |
| 적용 범위 | 양식을 적용한 의료진 1명만 즉시 반영 | 클라우드 양식 저장소가 한 번에 갱신 |

> 💡 **A-00·A-01·A-03 화면 자체는 두 환경에서 완전히 똑같습니다.** 차이는 마지막 "의료진에게 전달하기" 단계에서만 나타납니다.

---

## 1. 전체 흐름 한 장으로 보기 {#overview}

의료진의 사전문진 변경 요청을 받았을 때부터 환자에게 적용되기까지의 전체 흐름입니다.

> 💡 환경 시나리오 도식은 상단 패널의 이미지를 참고하세요.

---

## 2. A-00 — 의료진 선택과 작업 시작 대시보드 {#a00}

### 2-1. 이 화면에서 할 수 있는 일 {#a00-overview}

A-00은 모든 작업의 출발점입니다. 좌측 의료진 리스트에서 의료진을 클릭하면, 우측에 그 의료진의 사전문진 현황이 표시되고 다음 작업을 시작할 수 있습니다.

1. **운영 중인 양식 확인** — 지금 환자에게 보이는 양식이 어떻게 생겼는지 본다 (A-01로 이동)
2. **작업 중인 양식 이어서 편집** — 이전에 저장해뒀던 양식 편집을 이어서 한다 (A-03으로 이동)
3. **새 양식 만들기** — 빈 양식이나 운영 중인 양식을 복사해 새로 만든다 (A-03으로 이동)
4. **양식 파일 가져오기 (Import)** — 외부에서 만들어진 양식 파일(.txt)을 가져와 작업 중 양식으로 만든다
5. **양식 파일 내보내기** — 어떤 행의 양식이든 양식 파일로 만들어 외부로 전달
6. **배포완료 액션** — 작업 중 양식을 운영 중 양식으로 승격

### 2-2. 의료진 선택하기 {#a00-select-doctor}

좌측 패널에 **진료과 + 이름** 형태의 카드로 의료진 목록이 표시됩니다.

- 카드를 클릭하면 우측 영역이 그 의료진의 사전문진 정보로 전환됩니다.
- 상단 헤더에도 **"사전문진 커스텀 | {진료과} {이름} 교수님"** 으로 어떤 의료진을 보고 있는지 표시됩니다.

> ⚠️ **의료진이 목록에 없는 경우**
> 사전문진 커스텀 기능은 사전에 등록된 의료진만 사용할 수 있습니다. 목록에 없는 의료진이라면 개발팀에 마스터 등록을 요청해야 합니다(시스템 외부 절차).

### 2-3. 의료진의 4가지 상태 {#a00-cards}

의료진을 선택했을 때 우측에 보이는 카드 구성은 그 의료진이 처한 **4가지 상태**에 따라 달라집니다.

| 상태 | 운영 중 양식 | 작업 중 양식 | 우측에 보이는 카드 |
|---|---|---|---|
| ① 최초 사용자 | 없음 | 없음 | **[새 양식 만들기]** 카드 하나 |
| ② 작업만 시작해둔 최초 사용자 | 없음 | 있음 | **[작업 중 양식]** 카드 + **[새 양식 만들기]** 카드 |
| ③ 기존 사용자 | 있음 | 없음 | **[운영 중 양식 (Version N)]** 카드 + **[새 양식 만들기]** 카드 |
| ④ 작업 중인 기존 사용자 | 있음 | 있음 | **[운영 중 양식 (Version N)]** + **[작업 중 양식]** 두 카드 모두 |

> 📌 **의료진 1명당 작업 중 양식(Draft)은 동시에 1개만** 가질 수 있습니다. 새로 만들거나 양식 파일을 Import하면 이전 작업본은 자동으로 **이전 버전**으로 밀려납니다.

### 2-4. 전체 배포 로그 (변경 이력표) {#a00-log}

우측 하단에는 그 의료진의 양식 변경 이력이 표 형태로 쌓입니다. 각 행은 한 번의 저장·배포·적용 기록을 의미합니다.

**표의 컬럼**

| 컬럼 | 설명 |
|---|---|
| 버전 | V1, V2 형태. **운영 중 양식이 된 적이 있는 행에만** 번호가 매겨짐 |
| 저장 일시 | 양식이 저장된 시점 |
| 변경 요약 메모 | 무엇이 바뀌었는지 직접 적어두는 메모. 인라인 편집 가능 |
| 상태 | 작업 중 / 운영 중 / 이전 버전 3가지 |
| 내보내기 | 양식 파일로 만드는 액션 ([Copy] / [Download]) |
| 배포완료 | 작업 중 → 운영 중으로 승격하는 액션 버튼 (작업 중 행에만 노출) |

**상태 3가지 풀어 설명**

| 상태 | 의미 | 동시에 몇 개? |
|---|---|---|
| **작업 중** (Draft) | 편집 중인 양식. 환자에게는 보이지 않음 | 의료진당 1개만 |
| **운영 중** (Live) | 지금 환자에게 노출되는 양식 | 의료진당 1개 (없을 수도 있음) |
| **이전 버전** (Archived) | 과거 운영 중이었거나, 새 양식에 밀려난 양식 | 제한 없이 누적 |

> 📌 **버전 번호는 언제 매겨지나?**
> [배포완료] 클릭 → 작업 중 양식이 운영 중으로 승격되는 **그 순간**에만 번호가 자동으로 부여됩니다(V1, V2, V3...). 작업 중 상태에서는 버전 번호가 없습니다(`-`로 표시).

### 2-5. 양식 파일로 만들기 (내보내기) {#a00-export}

배포 로그의 각 행에는 **[Copy]** 와 **[Download]** 두 가지 내보내기 버튼이 있습니다. 어떤 상태(작업 중/운영 중/이전 버전)의 행이든 양식 파일로 만들 수 있습니다.

| 버튼 | 동작 |
|---|---|
| **[Copy]** | 그 행의 양식 데이터를 클립보드에 복사 |
| **[Download]** | 그 행의 양식을 텍스트 파일(.txt)로 다운로드 |

**언제 양식 파일을 만드나요?**

1. **개발팀에 시뮬레이션 의뢰**할 때 — 만들어진 양식이 실제로 환자에게 잘 보이는지 미리 테스트
2. **온프레미스 환경에서 의료진에게 전달**할 때 — 의료진 PC로 파일 전달 후 적용
3. **이전 버전으로 되돌리고 싶을 때** — 이전 버전 행을 내보내서 다시 Import

> 💡 [Copy]가 안 되는 경우(브라우저가 클립보드 권한을 거부)에는 [Download]로 우회하세요.

### 2-6. 양식 파일 가져오기 (Import) {#a00-import}

A-00 우상단의 **[import]** 버튼으로 외부에서 만들어진 양식 파일(.txt)을 가져와, 그 의료진의 **작업 중 양식**으로 적재할 수 있습니다.

**언제 쓰나요**

- 다른 의료진이 만든 양식을 가져와 시작점으로 쓸 때
- **이전 버전으로 되돌리기**(Rollback) — 이전 버전을 내보냈다가 다시 가져오기
- 개발팀이 시뮬레이션을 마친 양식을 다시 적재할 때

**동작**

1. **[import]** 버튼 클릭
2. 양식 파일을 선택하거나 클립보드 텍스트 붙여넣기
3. 그 의료진의 **작업 중 양식(Draft)** 카드에 적재됨
4. 이미 작업 중 양식이 있었다면 → 그 양식은 자동으로 **이전 버전**으로 강등

> ⚠️ **Import 결과물은 항상 작업 중 양식(Draft)입니다.** 운영 중으로 바로 적용되지 않습니다. 환자에게 적용하려면 [배포완료]로 승격해야 합니다.

### 2-7. 배포완료 액션 {#a00-deploy-action}

배포 로그의 **작업 중 양식(Draft) 행**에는 **[배포완료]** 버튼이 노출됩니다. 클릭하면 **작업 중 → 운영 중으로 승격**되어 환자에게 노출되기 시작합니다.

- **온프레미스**: 양식 파일을 의료진 PC로 전달하고 의료진이 적용을 완료한 뒤, 현장담당자가 [배포완료]를 클릭해 양식의 상태를 운영 중으로 마킹합니다.
- **클라우드 SaaS**: [배포완료] 클릭 = 즉시 환자에게 노출 시작.

> ⚠️ **[배포완료] 액션은 1회만 가능**하고 되돌릴 수 없습니다. 잘못 클릭했을 때는 이전 버전을 Import해 다시 [배포완료]로 승격해야 합니다.

### 📌 A-00 화면의 규칙 모음 {#a00-rules}

이 화면에서 꼭 기억해야 할 규칙입니다.

1. **의료진 1명당 작업 중 양식은 동시에 1개만** 가질 수 있다.
2. **운영 중 양식도 의료진당 1개**만 존재한다 (없을 수도 있다).
3. **이전 버전은 영구 누적**된다. 삭제되지 않는다.
4. **버전 번호(V1, V2…)는 운영 중으로 승격되는 순간에만** 자동 매겨진다.
5. **[배포완료] 액션은 1회만 가능**, 되돌릴 수 없다.
6. **목록에 없는 의료진**은 개발팀 등록 요청 필요.
7. 새 양식·Import로 밀려난 작업본은 자동으로 **이전 버전**으로 강등된다.
8. **Import 결과는 항상 작업 중 양식**. 운영 중으로 직접 들어가지 않는다.

## 3. A-01 — 운영 중인 양식 들여다보기 {#a01}

### 3-1. 어떨 때 쓰나요 {#a01-when}

의료진이 "지금 환자에게 어떤 질문이 나가고 있어요?" 라고 물었을 때 사용하는 화면입니다.

- **편집은 불가능**합니다. 보기 전용(read-only)입니다.
- 편집은 A-03에서만 가능합니다.

**진입 경로**: A-00의 **[운영 중 양식 카드]** 클릭 또는 배포 로그에서 **운영 중 상태 행** 클릭

### 3-2. 화면 3분할 읽는 법 {#a01-layout}

화면은 세 영역으로 나뉘어 있습니다.

| 영역 | 무엇이 보이나 |
|---|---|
| **좌측** [내 그룹 보기] | 문항이 **문항 분류별**로 묶여 아코디언으로 표시. 분류 이름 + 그 안의 문항 수가 함께 표기 |
| **중앙** [선택 문항 정보] | 좌측에서 클릭한 문항의 상세 (분류·타입·내용·설명·안내 메시지·답변 항목) |
| **우측** [선택 문항 미리보기] | 그 문항이 환자 모바일 화면에서 어떻게 보이는지 시각화 |

> 💡 **문항 분류** = 좌측에 보이는 그룹의 식별자입니다. 예: "과거 병력", "약물력", "흡연력" 등.

### 3-3. 문항 구조 이해하기 {#a01-question-types}

문항은 두 가지 종류로 나뉩니다.

**필수 문항** — 환자가 어떤 답변을 선택하든 반드시 한 번 거치는 질문
- 모든 문항 분류는 필수 문항을 최소 1개 이상 가집니다.

**후속 문항** — 필수 문항의 특정 답변을 선택했을 때만 이어지는 질문
- 좌측 패널에서는 필수 문항 아래에 **들여쓰기(indent)** 형태로 표시됩니다.
- 후속 문항이 또 다른 후속 문항을 가질 수도 있습니다.
- 모든 후속 문항을 마치면 다음 필수 문항으로 이어집니다.

### 3-4. 답변 타입 4종이 어떻게 보이나 {#a01-answer-types}

답변 항목은 총 4가지 타입이 있고, 화면에서 각각 다르게 렌더링됩니다.

| 타입 | 화면에 보이는 모습 | 후속 문항 분기 |
|---|---|---|
| **단일 선택** | 답변 행마다 좌측에 분기 뱃지 + (후속 문항이 있으면) 이동 링크 | ✅ 가능 |
| **복수 선택** | 답변 행마다 좌측에 분기 뱃지 + (후속 문항이 있으면) 이동 링크 | ✅ 가능 |
| **숫자 입력** | [인풋 타이틀 / 입력 칸 / 유닛 뱃지] 3슬롯 카드. 유닛이 드롭다운이면 옵션도 펼쳐 보임 | ❌ 불가 (분기 종점) |
| **글자 입력** | 환자에게 보일 안내 문구(placeholder)를 읽기 전용으로 표시. 최대 500자 | ❌ 불가 (분기 종점) |

**분기 뱃지 2종 (단일·복수 선택에서만)**

| 뱃지 | 의미 |
|---|---|
| **후속 문항 연결** | 이 답변을 선택하면 하위 문항으로 분기. "→ 연결 문항으로 이동" 링크 노출 |
| **다음 문항 연결** | 이 답변을 선택하면 곧바로 다음 필수 문항으로 이동 |

### 📌 A-01 화면의 규칙 모음 {#a01-rules}

1. **A-01은 보기 전용**이다. 어떤 편집도 할 수 없다.
2. **편집이 필요하면 [← 대시보드로 돌아가기] → A-00 → A-03**으로 이동해야 한다.
3. 좌측에 보이는 **문항 수 = 필수 문항 + 후속 문항** 총합이다.

## 4. A-03 — 양식 만들고 수정하기 {#a03}

여기서부터가 실제 양식 편집이 일어나는 핵심 화면입니다. 추가·조회·수정·삭제 모두 이 화면 하나에서 진행됩니다.

### 4-1. A-03으로 들어오는 길 {#a03-entry}

A-00에서 두 가지 카드 중 하나를 클릭하면 A-03로 진입합니다.

**경로 ①: [작업 중 양식 → 편집 이어하기]**

이전에 저장해둔 작업 중 양식을 그대로 불러와 편집을 이어갑니다. 별도 옵션 없이 바로 A-03 진입.

**경로 ②: [새 양식 만들기]**

작업 중 양식이 없을 때 노출되는 카드입니다. 클릭하면 두 가지 시작 방식 중 하나를 선택합니다.

| 옵션 | 동작 | 언제 쓰나요 |
|---|---|---|
| **[현재 버전 복사하기]** | 지금 운영 중인 양식(Live)을 그대로 복사해 **작업 중 양식(Draft)**으로 만든 뒤 편집 시작 | 운영 중 양식을 **기반으로 부분 수정**할 때 (가장 흔한 경로) |
| **[새 버전 생성]** | 빈 양식부터 시작 | 최초 사용자 또는 **처음부터 새로 만들** 때 |

> 💡 **[현재 버전 복사하기]는 기존 사용자에게만 노출**됩니다. 운영 중 양식이 없는 최초 사용자는 [새 버전 생성]만 사용 가능합니다.

> 💡 A-00에서 [import]로 외부 양식 파일을 가져온 경우에도 결과물은 작업 중 양식(Draft)이며, 이후 [편집 이어하기]로 A-03에 진입합니다. (자세한 Import 동작은 2-6 참조)

### 4-2. 화면 구성 {#a03-layout}

A-03도 3분할입니다. 단, A-01과 달리 **모든 영역이 편집 가능**합니다.

| 영역 | 무엇을 하나 |
|---|---|
| **좌측** [내 그룹 수정하기] | 문항 그룹 아코디언 + **[신규 문항 추가]** 버튼 + 샘플 문항 패널 + **[저장하기]** 버튼 |
| **중앙** [문항 상세 편집] / [답변 항목 수정] | 좌측에서 선택한 문항의 상세 정보와 답변을 편집 |
| **우측** [미리보기] | 환자 화면 실시간 미리보기 + **[시뮬레이션 해보기]** (환자 입장 체험 모드) |

> 💡 **마지막 저장 시점**은 **우측 상단 헤더**에 `YYYY.MM.DD-HH:MM` 형태로 표시됩니다.

### 4-3. 양식의 구조 한눈에 {#a03-structure}

편집을 시작하기 전에, 양식이 어떻게 구성되어 있는지 머리에 그려두면 훨씬 수월합니다.

```
문항 그룹 (= 문항 분류로 식별, 좌측 '내 그룹'에 표시)
   ├─ 필수 문항 (그룹당 1개 이상, 여러 개 가능)
   │   ├─ [문항 상세] — 분류·타입·내용·설명·안내메세지 등
   │   ├─ [답변 항목] — 단일/복수/숫자/글자 중 1종
   │   └─ 후속 문항 (부모 답변 타입이 단일·복수일 때만 만들 수 있음)
   │       ├─ [문항 상세]
   │       ├─ [답변 항목] — 단일/복수/숫자/글자 중 1종 (4종 모두 가능)
   │       └─ 후속 문항 (이 후속 문항의 답변 타입이 단일·복수일 때만 가능)
   └─ 필수 문항
       └─ ...
```

**핵심 개념 3가지**

1. **문항 = [문항 상세] + [답변 항목]** 두 정보로 구성됩니다.
2. **문항 그룹은 "문항 분류"로 식별됩니다.** 필수 문항을 만들 때 어떤 문항 분류를 고르느냐에 따라 새 그룹이 생기거나 기존 그룹에 편입됩니다.
3. **후속 문항도 4가지 답변 타입을 모두 가질 수 있습니다.** 단, 숫자/글자 답변 타입의 문항은 자식 후속 문항을 가질 수 없으므로 그 분기의 **종점**이 됩니다.

### 4-4. 문항 추가하기 {#a03-create}

추가 경로는 3가지입니다.

**경로 ① — 빈 양식부터 새 필수 문항 만들기**

1. 좌측 패널 상단의 **[신규 문항 추가]** 버튼 클릭
2. **답변 타입 선택 모달(M-02)**이 뜸 — 4가지 중 하나 선택
   - 단일 선택 / 복수 선택 / 숫자 입력 / 글자 입력
3. **[확인]** 클릭 → 빈 문항 카드가 생성되어 중앙 패널에서 편집 가능 상태
4. 필수 항목 입력 — **문항 분류 · 답변 요약 위치 · 문항 내용 · 답변 항목** (모두 *)
5. 좌측 **[저장하기]** 클릭 시 일괄 검증 후 작업 중 양식에 반영

> 💡 **문항 분류 선택의 의미** — 이 선택에 따라 새 그룹이 만들어지거나 기존 그룹에 편입됩니다. 즉, 문항 분류 = 그룹 식별자입니다.

**경로 ② — 샘플 문항을 통째로 가져와서 시작하기**

1. 좌측 하단의 **샘플 문항 패널**에서 원하는 샘플 그룹 확인
2. **[내 그룹에 추가하기]** 클릭
3. 샘플 그룹이 통째로 복제되어 내 그룹에 들어옴
4. 이후 자유롭게 편집

**경로 ③ — 후속 문항 만들기**

1. **부모 문항(필수 문항 또는 다른 후속 문항)의 답변 타입이 단일 선택 또는 복수 선택**일 때 가능
2. 각 답변 항목 옆의 **[후속문항 연결]** 드롭다운에서 새 후속 문항 생성
3. 후속 문항의 답변 타입은 **4가지 모두 가능** (단일/복수/숫자/글자)
4. 단, 숫자/글자 답변을 가진 후속 문항은 또 다른 후속 문항을 가질 수 없음 (분기의 종점)

> ⚠️ **숫자 입력·글자 입력 답변을 가진 문항은 자식 후속 문항을 만들 수 없습니다.** 해당 답변 옆에는 [후속문항 연결] 드롭다운이 노출되지 않습니다.

### 4-5. 문항 조회하기 {#a03-read}

좌측 패널에서 문항 그룹 아코디언을 열고 → 원하는 문항 클릭 → 중앙에 [문항 상세] + [답변 항목]이 편집 가능 상태로 표시되고, 우측 미리보기도 실시간으로 연동됩니다.

### 4-6. 문항 수정하기 {#a03-update}

수정 가능한 항목들입니다.

| 영역 | 수정 내용 |
|---|---|
| 문항 상세 | 분류 · 답변 요약 위치 · 문항 내용 · 설명 · 안내 메시지 등 |
| 답변 항목 | 답변 타입 변경 / 답변 항목 추가·삭제·순서 변경 |
| 문항 순서 | 필수 문항 단위로만 이동 가능 |
| 후속 문항 연결 | 기존 분기 구조 안에서만 변경 가능 |
| 문항 그룹 이동 | 문항 분류를 다른 값으로 바꾸면 다른 그룹으로 이동 (해당 문항과 종속된 후속 문항이 함께 이동) |

> ⚠️ **답변 타입을 바꿀 때 주의**
> - **단일 ↔ 복수**: 데이터 유지된 채 즉시 전환
> - **그 외 조합**: 확인 모달이 뜬 뒤, 확정 시 기존 답변 데이터가 **모두 삭제**되고 전환됩니다.

> ⚠️ **변경할 수 없는 것**
> - 문항 타입(필수 ↔ 후속). 바꾸려면 삭제 후 다시 생성해야 합니다.
> - 후속 문항을 그룹 간 단독 이동시키는 것. 또는 새로운 분기를 만드는 것.

### 4-7. 문항 삭제하기 {#a03-delete}

| 삭제 단위 | 함께 삭제되는 것 (cascade) |
|---|---|
| **문항 그룹** | 그룹 안의 모든 필수·후속 문항이 함께 삭제 |
| **필수 문항** | 그 문항에 연결된 모든 후속 문항이 함께 삭제 |
| **후속 문항** | 자기 자신 + (있다면) 자식 후속 문항이 함께 삭제 |
| **답변 항목** (단일·복수·숫자) | 자기 자신만 삭제 |

> ⚠️ **그룹/필수 문항 삭제 시 확인 모달**이 뜹니다. "후속 문항 N개도 함께 삭제됩니다" 안내를 꼭 확인하세요.

**삭제 후 지켜야 하는 최소 요건**
- 문항 그룹: 필수 문항 **≥ 1개** (마지막 필수 문항을 삭제하면 그룹도 함께 사라집니다)
- 복수 선택지: **≥ 2개**
- 숫자 입력 인풋: **1~2개** (최소 1개, 최대 2개)

위 요건을 충족하지 못하면 [저장하기] 버튼이 작동하지 않고, 좌측 해당 문항 그룹 카드에 **주황색 테두리**가 표시됩니다.

> 💡 답변 항목을 전부 삭제하면 답변 타입을 다시 고를 수 있는 UI가 나타납니다.

### 4-8. 환자 입장으로 미리 써보기 {#a03-preview}

우측 패널에서 두 가지 확인 방법을 제공합니다.

| 방법 | 동작 |
|---|---|
| **실시간 미리보기** | 편집 중인 내용이 환자 모바일 화면 기준으로 우측에 즉시 반영 |
| **[시뮬레이션 해보기]** 버튼 | 환자 입장에서 양식을 직접 풀어보는 체험 모드 |

> 💡 시뮬레이션은 분기·후속 문항이 의도대로 동작하는지 검증할 때 유용합니다.

### 4-9. 저장하기와 되돌리기 {#a03-save}

A-03에서의 모든 추가·수정·삭제는 **화면 안에서만 임시로** 일어납니다. **[저장하기]** 버튼을 눌러야 작업 중 양식(Draft)에 일괄 반영됩니다.

| 동작 | 결과 |
|---|---|
| **[저장하기]** (M-03) | 필수 요구사항 검증 통과 시 작업 중 양식 갱신, A-03 유지 |
| **[수정내용 되돌리기]** (M-04) | 현재 편집 세션의 모든 변경 사항 폐기 |
| **미저장 상태에서 다른 화면으로 이동 시도** | 경고 모달 노출 → 확인 시 미저장 내용 삭제 후 이동 |

**자주 만나는 예외 상황**

| 상황 | 화면 동작 |
|---|---|
| 필수 필드 미입력 상태에서 저장 시도 | 미입력 필드 하이라이트 + 오류 메시지, 저장 차단 |
| 복수 선택 선택지가 1개일 때 저장 시도 | "선택지는 최소 2개 이상 입력해야 합니다" 인라인 오류 |
| 답변 타입 변경 시 데이터 손실 발생 | 확인 모달 → 확정 시 기존 데이터 삭제 / 취소 시 이전 타입 유지 |
| 서버 저장 오류 | 오류 토스트 → 편집 화면 유지, 재시도 안내 |

> 💡 서버에 저장되므로 **PC가 갑자기 꺼져도 작업 중 양식은 보존**됩니다. 로컬 브라우저에만 저장되는 것이 아닙니다.

### 📌 A-03 화면의 규칙 모음 {#a03-rules}

1. 모든 추가·수정·삭제는 화면 안에서만 일어나고, **[저장하기]를 눌러야 반영**된다.
2. 문항 그룹은 **필수 문항을 최소 1개** 가져야 한다.
3. 복수 선택 답변은 **선택지가 최소 2개**.
4. 숫자 입력 답변은 인풋이 **최소 1개, 최대 2개**.
5. **후속 문항은 부모 답변 타입이 단일·복수일 때만** 만들 수 있다.
6. **후속 문항 자체는 4가지 답변 타입 모두 가능**. 단 숫자/글자는 분기의 종점.
7. **문항 타입(필수↔후속) 변경 불가** — 삭제 후 재생성.
8. **단일 ↔ 복수**는 데이터 유지된 채 전환, **그 외 답변 타입 변경**은 기존 데이터 삭제 경고.
9. **미저장 상태로 화면을 나가면 경고 모달**이 뜬다.
10. 작업 중 양식은 **서버에 저장**되므로 PC 오류 시에도 복구 가능.

## 5. 의료진에게 전달하기 (배포) {#deploy}

A-03에서 작업 중 양식을 저장한 뒤, 의료진에게 적용하는 단계입니다. **[배포완료] 액션 자체는 두 환경에서 동일**합니다. 차이는 의료진 PC에 양식 파일을 직접 전달해야 하는지뿐입니다.

### 5-1. 시뮬레이션 (선택 권장) {#deploy-simulation}

본 배포 전에 양식이 의도대로 동작하는지 검증하려면 **개발팀에 시뮬레이션을 의뢰**합니다.

1. A-00 배포 로그에서 해당 작업 중 양식 행의 **[Copy]** 또는 **[Download]**로 양식 파일을 만든다
2. 개발팀에 전달 → 개발팀이 시뮬레이션 실행
3. 이슈 발견 시 → A-03으로 돌아가 수정 후 다시 저장
4. 통과 시 → 다음 단계(의료진 전달) 진행

### 5-2. 온프레미스 환경 배포 {#deploy-onpremise}

병원 내부 서버에 V.Doc Pro가 설치된 환경입니다(현행 V.Doc Pro 표준).

```
[현장담당자] A-00 배포 로그 → [Copy] 또는 [Download]로 양식 파일 만들기
      ↓
[현장담당자] 의료진 PC로 양식 파일(.txt) 전달 (클립보드/USB/메일 등)
      ↓
[의료진] 본인 PC에서 사전문진 화면(C-01) 접속
      ↓
[의료진] [붙여넣기] 또는 [Import] 버튼으로 양식 파일 적용
      ↓
[현장담당자] A-00으로 돌아와 배포 로그의 [배포완료] 클릭 (작업 중 → 운영 중 승격)
      ↓
[종료] 해당 의료진의 양식이 운영 중으로 갱신됨
```

> ⚠️ **온프레미스에서는 의료진이 본인 PC에 직접 양식 파일을 적용**해야 합니다. 현장담당자의 [배포완료] 클릭은 양식의 상태를 **운영 중으로 마킹**하는 의미입니다.

### 5-3. 클라우드 SaaS 환경 배포 {#deploy-saas}

AITRICS 클라우드에 호스팅된 환경입니다(V.Doc 클라우드 등).

```
[현장담당자] A-00 배포 로그에서 해당 작업 중 양식 행의 [배포완료] 클릭
      ↓
[종료] 작업 중 → 운영 중 즉시 승격, 환자에게 노출 시작
```

> 💡 SaaS에서는 양식 파일을 만들거나 전달할 필요가 없습니다. **[배포완료] 버튼 한 번**으로 끝납니다.

### 5-4. 두 환경의 차이 한눈에 {#deploy-comparison}

| 단계 | 온프레미스 | 클라우드 SaaS |
|---|---|---|
| 양식 파일 생성 | 필요 ([Copy] 또는 [Download]) | 불필요 |
| 의료진 PC로 전달 | 필요 | 불필요 |
| 의료진의 적용 작업 | 필요 (붙여넣기 또는 Import) | 불필요 |
| 현장담당자의 [배포완료] 액션 | 필요 (적용 후 클릭 → 운영 승격) | 필요 (클릭 = 운영 승격) |
| 환자에게 노출 시점 | 의료진 적용 + [배포완료] 모두 끝난 후 | [배포완료] 즉시 |

## 6. 자주 만나는 상황 {#faq}

### 이전 양식으로 되돌리고 싶어요 (Rollback) {#faq-rollback}

A-00 배포 로그에서 되돌리고 싶은 **이전 버전 행**의 **[Copy]** 또는 **[Download]**로 양식 파일을 만든 뒤, **[import]** 버튼으로 다시 가져와 작업 중 양식으로 만든 다음, **[배포완료]**로 승격합니다.

- 변경 요약 메모에 **"롤백 — 이전 V{N} 재배포"** 라고 적어두는 것을 권장합니다.

### 작업 중인 양식이 사라졌어요 {#faq-draft-lost}

작업 중 양식(Draft)은 의료진당 1개만 존재할 수 있습니다. 다음 중 하나가 일어났을 가능성이 큽니다.

1. **새 양식 만들기**를 시도해서 이전 작업본이 이전 버전으로 강등됨
2. **외부 양식 파일을 Import**해서 이전 작업본이 밀려남
3. **[저장하기]를 누르지 않고** 화면을 떠남 → 미저장 내용 사라짐

→ 이전 버전(Archived) 행에서 [Copy]/[Download]로 양식 파일을 만든 뒤 [import]로 다시 가져올 수 있습니다.

### 의료진이 목록에 없어요 {#faq-doctor-missing}

사전문진 커스텀은 사전 등록된 의료진만 사용할 수 있습니다. **개발팀에 마스터 등록 요청**(시스템 외부 절차)이 필요합니다.

### 클립보드 복사가 안 돼요 {#faq-clipboard}

브라우저가 클립보드 권한을 거부했을 가능성이 큽니다. **[Download]** 버튼으로 양식 파일을 받아 우회하세요.

### 잘못 저장했어요 / 잘못 배포했어요 {#faq-mistakes}

- **잘못 저장**: A-03에서 다시 수정 후 저장하면 됩니다. 이전 저장본은 자동으로 이전 버전으로 보관됩니다.
- **잘못 배포**: [배포완료]는 되돌릴 수 없으므로, **이전 양식으로 되돌리기**(롤백) 절차를 따라 다시 [배포완료]로 승격해야 합니다.

## 7. 한눈에 보는 규칙 모음 {#rules}

### 양식·상태 규칙 {#rules-state}

| # | 규칙 |
|---|---|
| 1 | 의료진 1명당 **작업 중 양식(Draft)은 동시에 1개**만 가능 |
| 2 | 의료진 1명당 **운영 중 양식(Live)도 1개**만 존재 (없을 수도 있음) |
| 3 | **이전 버전(Archived)은 영구 누적** |
| 4 | **버전 번호(V1, V2…)는 운영 중으로 승격되는 순간**에만 매겨짐 |
| 5 | **[배포완료] 액션은 1회만 가능**, 되돌릴 수 없음 |
| 6 | 새 양식·외부 양식 적용으로 밀려난 작업본은 **이전 버전으로 자동 강등** |
| 7 | **Import 결과는 항상 작업 중 양식**. 운영 중으로 직접 들어가지 않음 |

### 문항·답변 규칙 {#rules-question}

| # | 규칙 |
|---|---|
| 8 | 문항 그룹은 **필수 문항을 최소 1개** 가져야 한다 |
| 9 | **복수 선택 답변은 선택지 최소 2개** |
| 10 | **숫자 입력 답변은 인풋 최소 1개, 최대 2개** |
| 11 | **후속 문항은 부모 답변 타입이 단일·복수**일 때만 만들 수 있다 |
| 12 | **후속 문항 자체는 4가지 답변 타입 모두 가능** (단 숫자/글자는 분기 종점) |
| 13 | **문항 타입(필수↔후속) 변경 불가** — 삭제 후 재생성 |
| 14 | **단일 ↔ 복수**는 데이터 유지된 채 전환 |
| 15 | **그 외 답변 타입 변경**은 기존 데이터가 삭제되므로 확인 모달 노출 |

  'deploy': 'img/사전문진 배포하기.png',

// ============================================================
// 1. Markdown 렌더링 + 헤딩 ID 추출
// ============================================================
const mdSource = document.getElementById('md-source').textContent;
// {#some-id} → marked가 그대로 텍스트로 두므로 후처리
let html = marked.parse(mdSource, { gfm: true, breaks: false });
document.getElementById('content').innerHTML = html;

// h2/h3에서 {#id} 추출 → id 속성 설정 + 텍스트에서 제거
document.querySelectorAll('#content h2, #content h3').forEach(h => {
  const m = h.innerHTML.match(/\s*\{#([^}]+)\}\s*$/);
  if (m) {
    h.id = m[1];
    h.innerHTML = h.innerHTML.replace(/\s*\{#[^}]+\}\s*$/, '');
  }
});

// ============================================================
// 2. blockquote 콜아웃 스타일 적용 (💡 → info, ⚠️ → warn, 📌 → rule)
// ============================================================
document.querySelectorAll('#content blockquote').forEach(bq => {
  const txt = bq.textContent.trim();
  if (txt.startsWith('💡')) bq.classList.add('callout-info');
  else if (txt.startsWith('⚠️')) bq.classList.add('callout-warn');
  else if (txt.startsWith('📌')) bq.classList.add('callout-rule');
});

// ============================================================
// 3. 목차(TOC) 생성
// ============================================================
const tocNav = document.getElementById('toc-nav');
const tocItems = [];
document.querySelectorAll('#content h2, #content h3').forEach(h => {
  if (!h.id) return;
  const a = document.createElement('a');
  a.href = '#' + h.id;
  a.textContent = h.textContent;
  a.dataset.target = h.id;
  if (h.tagName === 'H3') a.classList.add('lvl-3');
  a.addEventListener('click', (e) => {
    e.preventDefault();
    document.getElementById(h.id).scrollIntoView({ behavior: 'smooth', block: 'start' });
    history.replaceState(null, '', '#' + h.id);
  });
  tocNav.appendChild(a);
  tocItems.push({ id: h.id, link: a, tag: h.tagName });
});

// ============================================================
// 4. 현재 보이는 섹션 추적 → 목차 강조 + 화면 패널 교체
// ============================================================
const captureContent = document.getElementById('capture-content');
const capturePlaceholder = document.getElementById('capture-placeholder');
const placeholderChapter = capturePlaceholder.querySelector('.chapter');
const placeholderTitle = capturePlaceholder.querySelector('.title');
const placeholderHint = capturePlaceholder.querySelector('.hint');

// h3가 속한 h2(=대제목) 찾기
function findParentH2(id) {
  const headings = document.querySelectorAll('#content h2, #content h3');
  let lastH2 = null;
  for (const h of headings) {
    if (h.tagName === 'H2') lastH2 = h;
    if (h.id === id) return lastH2;
  }
  return null;
}

let currentSectionId = null;
function updateCapture(sectionId) {
  if (sectionId === currentSectionId) return;
  currentSectionId = sectionId;

  // 기존 이미지 모두 제거
  captureContent.querySelectorAll('.capture-image').forEach(el => el.remove());

  const captureValue = captureMap[sectionId];
  if (captureValue) {
    const paths = Array.isArray(captureValue) ? captureValue : [captureValue];
    captureContent.classList.toggle('multi', paths.length > 1);
    capturePlaceholder.style.display = 'none';

    paths.forEach(path => {
      const img = document.createElement('img');
      img.className = 'capture-image';
      // NFC로 먼저 시도, 실패 시 NFD로 재시도 (GitHub 업로드 시 일부 파일이 macOS NFD로 저장된 케이스 대응)
      const encNFC = encodeURI(path);
      const encNFD = encodeURI(path.normalize('NFD'));
      img.src = encNFC;
      img.onerror = function() {
        if (!img.dataset.retriedNFD && encNFC !== encNFD) {
          img.dataset.retriedNFD = '1';
          img.src = encNFD;
        }
      };
      img.alt = sectionId;
      img.addEventListener('click', () => {
        lightboxImg.src = img.src;
        lightbox.classList.add('show');
      });
      captureContent.insertBefore(img, capturePlaceholder);
    });
  } else {
    captureContent.classList.remove('multi');
    capturePlaceholder.style.display = 'block';
    const targetEl = document.getElementById(sectionId);
    const parentH2 = findParentH2(sectionId);
    placeholderChapter.textContent = parentH2 ? parentH2.textContent : '';
    placeholderTitle.textContent = targetEl ? targetEl.textContent : '';
    placeholderHint.textContent = '이 섹션은 화면 캡처 없이 텍스트로 설명됩니다';
  }

  // 목차 활성화
  tocItems.forEach(item => item.link.classList.toggle('active', item.id === sectionId));
}

// IntersectionObserver — 화면 상단 1/3 지점에 들어온 헤딩을 현재 섹션으로
const observer = new IntersectionObserver((entries) => {
  // 화면에 보이는 헤딩 중 가장 위쪽
  const visible = entries
    .filter(e => e.isIntersecting)
    .map(e => e.target);
  if (visible.length > 0) {
    // 위에서 가장 가까운 것
    visible.sort((a, b) => a.getBoundingClientRect().top - b.getBoundingClientRect().top);
    updateCapture(visible[0].id);
  }
}, {
  root: document.getElementById('content-wrap'),
  rootMargin: '0px 0px -70% 0px',
  threshold: 0,
});
document.querySelectorAll('#content h2[id], #content h3[id]').forEach(h => observer.observe(h));

// 초기 표시
const firstHeading = document.querySelector('#content h2[id], #content h3[id]');
if (firstHeading) updateCapture(firstHeading.id);

// ============================================================
// 5. 화면 패널 접기/펴기 토글 (localStorage 저장)
// ============================================================
const capturePanel = document.getElementById('capture-panel');
const captureToggle = document.getElementById('capture-toggle');
const collapsedBar = document.getElementById('capture-collapsed-bar');

function setCollapsed(collapsed) {
  capturePanel.classList.toggle('collapsed', collapsed);
  localStorage.setItem('capture-collapsed', collapsed ? '1' : '0');
}
captureToggle.addEventListener('click', (e) => { e.stopPropagation(); setCollapsed(true); });
collapsedBar.addEventListener('click', () => setCollapsed(false));

// 초기 상태 복원
if (localStorage.getItem('capture-collapsed') === '1') setCollapsed(true);

// 목차 접기/펴기 토글
const tocToggle = document.getElementById('toc-toggle');
const appEl = document.querySelector('.app');
function setTocCollapsed(collapsed) {
  appEl.classList.toggle('toc-collapsed', collapsed);
  tocToggle.textContent = collapsed ? '▶' : '◀';
  tocToggle.title = collapsed ? '목차 펴기' : '목차 접기';
  localStorage.setItem('toc-collapsed', collapsed ? '1' : '0');
}
tocToggle.addEventListener('click', () => {
  setTocCollapsed(!appEl.classList.contains('toc-collapsed'));
});
if (localStorage.getItem('toc-collapsed') === '1') setTocCollapsed(true);

// ============================================================
// 6. 라이트박스 (캡처 클릭 시 확대)
// ============================================================
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
const lightboxClose = document.getElementById('lightbox-close');

// 각 이미지 클릭 핸들러는 updateCapture에서 동적 부착
lightbox.addEventListener('click', () => lightbox.classList.remove('show'));
lightboxClose.addEventListener('click', (e) => { e.stopPropagation(); lightbox.classList.remove('show'); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') lightbox.classList.remove('show');
});

// ============================================================
// 7. 페이지 로드 시 URL 해시가 있으면 그쪽으로 스크롤
// ============================================================
if (location.hash) {
  setTimeout(() => {
    const el = document.querySelector(location.hash);
    if (el) el.scrollIntoView({ behavior: 'auto', block: 'start' });
  }, 100);
}
</script>
